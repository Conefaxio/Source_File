name: Daily refresh (AllPrintings + Rules + Brains)

on:
  push:
    branches: ["main"]
    paths:
      - "New_brains/**"
      - "daily_refresh.py"
      - ".github/workflows/daily-refresh.yml"
  schedule:
    - cron: "25 03 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write            # necesario para poder pushear commits con GITHUB_TOKEN

concurrency:
  group: daily-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      # Cache: evita descargar de nuevo el default_cards gigante y (opcionalmente) AllPrintings.json
      - name: Cache large downloads
        uses: actions/cache@v4
        with:
          path: |
            cache_scryfall
            AllPrintings.json
          key: mtg-cache-${{ runner.os }}-v1
          restore-keys: |
            mtg-cache-${{ runner.os }}-

      - name: Run generator script
        run: |
          python daily_refresh.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Daily refresh $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # NUEVO: traer cambios remotos antes de pushear para evitar 'tip is behind'
          git pull --rebase origin main
          git push origin main




