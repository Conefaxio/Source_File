name: Weekly Meta Refresh

on:
  schedule:
    - cron: "0 6 * * 1"  # Lunes 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Refresh meta
        run: |
          python scripts/meta_weekly_refresh.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Meta
          git diff --cached --quiet || git commit -m "chore(meta): weekly refresh"
          git push
